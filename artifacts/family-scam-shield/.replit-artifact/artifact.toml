kind = "mobile"
previewPath = "/family-scam-shield/"
title = "Family Scam Shield"
description = "An Android-first mobile app that helps families check suspicious texts and links in plain language, with an optional trusted-contact alert setting."
version = "1.0.0"
id = "artifacts/family-scam-shield"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/family-scam-shield/" ]
localPort = 21167

[services.development]
run = "pnpm --filter @workspace/family-scam-shield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-scam-shield", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/family-scam-shield", "run", "serve" ]

[services.env]
PORT = "21167"
BASE_PATH = "/family-scam-shield/"
